# horario: inverno
name: Verificar Validações Pendentes (Diário)
concurrency:
  group: repo-write
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install pywebpush
    - name: Sincronizar repositório
      run: 'git config user.name "Bot Validações"

        git config user.email "bot@github.com"

        git config pull.rebase false

        git pull origin main --rebase

        '
    - name: Verificar validações e enviar push
      env:
        VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE }}
        VAPID_EMAIL: ${{ secrets.EMAIL_REMETENTE }}
      run: python scripts/verificar_validacoes_pendentes.py
    - name: Commit do estado
      run: "git add apostas/estado_validacoes.json\nif ! git diff --cached --quiet;\
        \ then\n  git commit -m \"Atualiza estado de validações (diário)\"\n  n=0\n\
        \  until git push origin main; do\n    n=$((n+1))\n    if [ \"$n\" -ge 5 ];\
        \ then\n      echo \"❌ Push falhou após 5 tentativas\"\n      exit 1\n   \
        \ fi\n    sleep 15\n  done\nfi\n"
'on':
  schedule:
  - cron: 0 12 * * *
  workflow_dispatch: null
